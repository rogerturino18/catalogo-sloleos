<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Catálogo SL Óleos · Folheável</title>
<meta name="theme-color" content="#212020">
<link rel="icon" href="img/logo-v.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap">
<link rel="stylesheet" href="lib/base.css">
<style>
/* Layout: mesa grafite com o catálogo impresso no centro; barra de navegação embaixo */
html,body{height:100%}
body{background:radial-gradient(120% 80% at 50% 25%,#3a3938 0%,var(--grafite) 70%);overflow:hidden;display:flex;flex-direction:column;padding-top:var(--sa-t)}
.mesa{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:44px max(12px,var(--sa-l)) 8px max(12px,var(--sa-r))}
#livro{margin:0 auto}
.page{background:linear-gradient(180deg,#fdfdfc 0%,var(--steel) 100%);overflow:hidden;container-type:size;color:var(--ink)}
.pg{position:absolute;inset:0;display:flex;flex-direction:column;padding:6cqw 6.5cqw 5cqw}
.cab{display:flex;justify-content:space-between;align-items:center;margin-bottom:4.5cqw}
.cab img{height:5.2cqw;width:auto}
.cab span{font:700 2.4cqw/1 var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--verde)}
.rodape{margin-top:auto;display:flex;justify-content:space-between;align-items:center;font:600 2.4cqw/1 var(--f-body);color:var(--ink-soft);letter-spacing:.1em;padding-top:3cqw;border-top:1px solid var(--line)}
.rodape b{color:var(--grafite)}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.05;text-wrap:balance}
.titulo{font-size:7.6cqw;font-weight:700;letter-spacing:-.01em}
.titulo::after{content:"";display:block;width:24cqw;height:1cqw;background:var(--amarelo);margin-top:3cqw}

/* Capa — no padrão dos posts: foto com moldura amarela, título amarelo */
.capa{background:var(--grafite);color:#fff}
.capa .foto{position:absolute;inset:0;background-size:cover;background-position:center}
.capa .foto::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(33,32,32,.15) 30%,rgba(33,32,32,.92) 78%)}
.capa .moldura-capa{position:absolute;inset:3.4cqw;border:.5cqw solid var(--amarelo);border-radius:2.4cqw;z-index:2;pointer-events:none}
.capa .pg{z-index:1;padding:10cqw 10cqw 9cqw}
.capa .topo{display:flex;justify-content:space-between;align-items:center}
.capa .topo img{width:34cqw}
.capa .topo span{font:700 2.4cqw/1 var(--f-body);letter-spacing:.14em;color:var(--amarelo)}
.capa .hv-titulo{font-size:9cqw;margin:3cqw 0}
.capa .hv-texto{font-size:3.5cqw;margin:0}
.capa .grafismo{width:62%;height:6cqw}

/* Índice */
.indice ol{list-style:none;margin:4cqw 0 0;padding:0}
.indice li button{all:unset;cursor:pointer;display:flex;align-items:baseline;gap:2cqw;width:100%;padding:1.9cqw 0;font:600 3.5cqw/1.15 var(--f-body)}
.indice li button .dots{flex:1;border-bottom:1.5px dotted #b9b9b6;transform:translateY(-.8cqw)}
.indice li button .n{font:700 3.1cqw/1 var(--f-body);color:var(--verde)}
.indice li.sec{font:800 2.5cqw/1 var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--grafite);padding:3.4cqw 0 .6cqw;border-bottom:.5cqw solid var(--amarelo);align-self:flex-start;display:inline-block}

/* Quem somos */
.quem p{font-size:3.25cqw;line-height:1.5;margin:3.6cqw 0 0;color:var(--ink-soft)}
.quem .frase{font:700 italic 3.4cqw/1.4 var(--f-body);color:var(--grafite);border-left:1cqw solid var(--verde-claro);padding-left:3cqw}
.nums{display:grid;grid-template-columns:1fr 1fr;gap:3cqw 4cqw;margin:4cqw 0}
.nums b{display:block;font:800 8.4cqw/1 var(--f-display);color:var(--verde)}
.nums span{font-size:2.8cqw;font-weight:600;line-height:1.25;display:block;color:var(--ink-soft)}
.quem .inox{flex:1;min-height:0;border-radius:2cqw;background-size:cover;background-position:center 30%}

/* Página de máquina */
.maq .foto{flex:1.2;min-height:0;background:#fff;border-radius:2cqw;display:flex;align-items:center;justify-content:center;margin-bottom:4cqw;position:relative;overflow:hidden}
.maq .foto img{max-width:100%;max-height:100%;object-fit:contain;padding:3cqw}
.maq .foto.cena{background:var(--grafite);flex:none;height:42cqh;margin-bottom:3cqw}
.maq.tem-cena h3{font-size:6.2cqw;margin-bottom:1.6cqw}
.maq.tem-cena p{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:1.6cqw}
.maq.tem-cena .linha1{margin-bottom:1.6cqw}
.maq.tem-cena .acoes{margin-top:2cqw}
.maq .foto.cena img{position:relative;z-index:1;width:100%;height:100%;object-fit:contain;padding:3.4cqw}
.maq .foto .desf{position:absolute;inset:-10%;background-size:cover;background-position:center;filter:blur(14px) brightness(.5)}
.maq .foto.cena::after{content:"";position:absolute;z-index:2;inset:2cqw;border:.45cqw solid var(--amarelo);border-radius:1.6cqw}
.maq .foto .novo{position:absolute;right:3cqw;top:3cqw;z-index:1;font:800 2.3cqw/1 var(--f-body);letter-spacing:.12em;background:var(--amarelo);color:var(--grafite);padding:1.4cqw 2cqw;border-radius:99px}
.maq .linha1{display:flex;align-items:center;gap:2.5cqw;flex-wrap:wrap;margin-bottom:2.2cqw}
.maq .plaqueta{font-size:2.5cqw;padding:1.4cqw 2cqw}
.maq .cap{font:700 2.9cqw/1 var(--f-body);color:var(--verde)}
.maq h3{font-size:7cqw;font-weight:800;margin-bottom:2.2cqw}
.maq p{font-size:3.1cqw;line-height:1.45;margin:0 0 2.2cqw;color:var(--ink-soft)}
.maq .ficha th{font-size:2.2cqw;padding:1.5cqw 2cqw 1.5cqw 0}
.maq .ficha td{font-size:2.8cqw;padding:1.5cqw 0}
.maq .acoes{display:flex;gap:2cqw;margin-top:2.6cqw}
.maq .btn-orc{font-size:2.8cqw;padding:2.2cqw 3.6cqw;color:var(--grafite)}

/* Peças */
.pecas p.lead{font-size:3.3cqw;margin:3cqw 0;color:var(--ink-soft)}
.pecas .fotos{display:grid;grid-template-columns:repeat(3,1fr);gap:2cqw;margin-bottom:3cqw}
.pecas .fotos figure{margin:0}
.pecas .fotos img{aspect-ratio:1;object-fit:cover;width:100%;background:#fff;border-radius:1.5cqw}
.pecas figcaption{font:600 2.3cqw/1.2 var(--f-body);margin-top:1cqw;color:var(--ink-soft)}
.pecas table{width:100%;border-collapse:collapse;margin-bottom:3cqw}
.pecas td{padding:2cqw 0;border-bottom:1px solid var(--line);font:700 3.2cqw/1.2 var(--f-body)}
.pecas td+td{text-align:right;font-weight:600;font-size:2.9cqw;color:var(--verde)}
.pecas .btn-orc{font-size:2.8cqw;padding:2.2cqw 3.6cqw;align-self:flex-start}

/* Obras */
.obras .grade{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr 1fr;grid-auto-rows:1fr;gap:1.8cqw;margin-top:4cqw}
.obras .grade img{width:100%;height:100%;object-fit:cover;border-radius:1.4cqw}

/* Contracapa — variação 04 do manual: fundo amarelo */
.contra{background:var(--amarelo);color:var(--grafite)}
.contra h2{font-size:9.4cqw;font-weight:800;text-transform:uppercase;line-height:1;margin:6cqw 0 5cqw}
.contra .wa{display:flex;align-items:center;justify-content:center;gap:2.5cqw;background:var(--grafite);color:#fff;text-decoration:none;border-radius:2cqw;padding:4cqw;font:800 3.6cqw/1 var(--f-body);letter-spacing:.06em;text-transform:uppercase;margin-bottom:6cqw}
.contra .wa svg{width:6cqw;height:6cqw;color:#5fd38d}
.contra dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:2.4cqw 4cqw;font-size:3.1cqw;font-weight:600}
.contra dt{font:700 2.3cqw/1.6 var(--f-body);letter-spacing:.14em;text-transform:uppercase;opacity:.65}
.contra dd{margin:0;overflow-wrap:anywhere}
.contra a{color:inherit}
.contra img.logo{width:40cqw;margin-top:auto}

/* Barra inferior */
.barra{flex:none;display:flex;align-items:center;justify-content:center;gap:10px;padding:8px max(12px,var(--sa-l)) calc(12px + var(--sa-b)) max(12px,var(--sa-r));color:#fff}
.barra button{width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.06);color:#fff;font-size:20px;cursor:pointer}
.barra .pag{font:700 12px/1 var(--f-body);letter-spacing:.08em;min-width:96px;text-align:center;color:#d6d6d4}
.barra .ind{width:auto;border-radius:99px;padding:0 16px;font:700 12px/1 var(--f-body);letter-spacing:.1em;text-transform:uppercase;background:var(--amarelo)!important;color:var(--grafite)!important;border:0!important}
.dica{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:70;background:rgba(33,32,32,.92);color:#fff;padding:14px 18px;border-radius:12px;font:600 14px/1.35 var(--f-body);text-align:center;pointer-events:none;transition:opacity .5s}
#orc-bar{bottom:calc(70px + var(--sa-b))}
</style>
</head>
<body>
<a class="proto-back" href="formatos.html">← Formatos</a>
<div class="mesa"><div id="livro"></div></div>
<div class="barra">
  <button id="ant" aria-label="Página anterior">‹</button>
  <span class="pag" id="pag">CAPA</span>
  <button id="prox" aria-label="Próxima página">›</button>
  <button class="ind" id="irIndice">Índice</button>
</div>
<div class="dica" id="dica">Deslize ou use as setas<br>para virar a página</div>
<div id="orc-bar"></div>

<script src="lib/dados.js"></script>
<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
<script>
const livro = document.getElementById("livro");
const cab = t => `<div class="cab"><img src="${LOGO}" alt="SL Óleos"><span>${t}</span></div>`;
const rod = n => `<div class="rodape"><span><b>SL ÓLEOS</b> · CATÁLOGO 2026</span><span>${String(n).padStart(2,"0")}</span></div>`;
const PG_MAQ = 4;
const ORDEM = {preparo:0,prensagem:1,refino:2,planta:3};
const LISTA = [...PRODUTOS].sort((a,b)=>ORDEM[a.etapa]-ORDEM[b.etapa]);
let html = "";

html += `<div class="page capa" data-density="hard"><div class="hv"><img src="${foto("obra-noturna")}" alt=""><video autoplay muted loop playsinline preload="auto" aria-hidden="true"><source src="${VIDEO_FABRICA}" type="video/mp4"></video></div><div class="pg">
  <div class="topo"><img src="${LOGO_BRANCO}" alt="SL Óleos"><span>EDIÇÃO 2026</span></div>
  <div class="hv-eyebrow" style="margin-top:auto;font-size:2.4cqw">Jaú/SP · Brasil · Catálogo de equipamentos</div>
  <h1 class="hv-titulo">Extração de óleos <span>vegetais</span> de ponta a ponta</h1>
  <p class="hv-texto">Fabricamos máquinas, plantas completas e peças de reposição para extração e refino de óleos vegetais, com engenharia própria para cada projeto.</p>
</div></div>`;

const grupo = e => LISTA.map((p,i)=>[p.nome,PG_MAQ+i,p.etapa]).filter(x=>x[2]===e);
const itens = [
  ["sec","A empresa"],["Quem somos",3],
  ["sec","Preparo da semente"], ...grupo("preparo"),
  ["sec","Prensagem"], ...grupo("prensagem"),
  ["sec","Refino"], ...grupo("refino"),
  ["sec","Instalações completas"], ...grupo("planta"),
  ["sec","Pós-venda"],["Peças de reposição",PG_MAQ+LISTA.length],["sec","Portfólio"],["Plantas entregues",PG_MAQ+LISTA.length+1],["Nossa fábrica",PG_MAQ+LISTA.length+2],["Equipamentos",PG_MAQ+LISTA.length+3],["Contato",PG_MAQ+LISTA.length+4]
];
html += `<div class="page indice"><div class="pg">${cab("Sumário")}<h2 class="titulo">Índice</h2><ol>
  ${itens.map(it => it[0]==="sec" ? `<li class="sec">${it[1]}</li>` : `<li><button data-ir="${it[1]}">${it[0]}<span class="dots"></span><span class="n">${String(it[1]).padStart(2,"0")}</span></button></li>`).join("")}
</ol>${rod(2)}</div></div>`;

html += `<div class="page quem"><div class="pg">${cab("Quem somos")}
  <h2 class="titulo">Equipamentos sob medida para a indústria de óleos vegetais</h2>
  <p>A SL Óleos nasceu da longa experiência de seus sócios no processamento de óleos vegetais. Projetamos e fabricamos cada equipamento conforme a demanda do cliente, com engenharia própria do projeto à montagem.</p>
  <div class="nums">${EMPRESA.numeros.map(n=>`<div><b>${n[0]}</b><span>${n[1]}</span></div>`).join("")}</div>
  <p class="frase">${EMPRESA.frase}</p>
  <div class="inox" style="background-image:url('${foto("obra-equipe")}');margin-top:4cqw"></div>
  ${rod(3)}</div></div>`;

LISTA.forEach((p,i) => {
  html += `<div class="page maq ${p.cena?"tem-cena":""}"><div class="pg">${cab(p.cat)}
    <div class="foto ${p.cena?"cena":""}">${p.cena?`<div class="desf" style="background-image:url('${p.img}')"></div>`:""}${p.novo?'<span class="novo">NOVO</span>':""}<img src="${p.img}" alt="${p.nome}" loading="lazy"></div>
    <div class="linha1"><span class="plaqueta">${p.m}</span>${p.cap?`<span class="cap">${p.cap}</span>`:""}</div>
    <h3>${p.nome}</h3>
    <p>${p.desc}</p>
    <table class="ficha">${p.ficha.map(f=>`<tr><th>${f[0]}</th><td>${f[1]}</td></tr>`).join("")}</table>
    <div class="acoes"><button class="btn-orc" data-orc="${p.id}"><span class="lbl">+ Orçamento</span></button></div>
    ${rod(PG_MAQ+i)}</div></div>`;
});

const nP = PG_MAQ + LISTA.length;
html += `<div class="page pecas"><div class="pg">${cab("Reposição")}
  <h2 class="titulo">Peças de reposição</h2><p class="lead">${PECAS.desc}</p>
  <div class="fotos">${PECAS.fotos.map(f=>`<figure><img src="${f[0]}" alt="${f[1]}" data-zoom="${f[0]}" loading="lazy"><figcaption>${f[1]}</figcaption></figure>`).join("")}</div>
  <table>${PECAS.maquinas.map(m=>`<tr><td>${m[0]}</td><td>${m[1]}</td></tr>`).join("")}</table>
  <button class="btn-orc" data-orc="pecas"><span class="lbl">+ Orçamento</span></button>
  ${rod(nP)}</div></div>`;

const pgGaleria = (rotulo, titulo, itens, n) => `<div class="page obras"><div class="pg">${cab(rotulo)}
  <h2 class="titulo">${titulo}</h2><div class="grade">${itens.slice(0,9).map(g=>`<img src="${mini(g[0])}" alt="${g[1]}" data-zoom="${foto(g[0])}" loading="lazy">`).join("")}</div>
  ${rod(n)}</div></div>`;
html += pgGaleria("Portfólio","Plantas entregues",GALERIA.obras,nP+1);
html += pgGaleria("Jaú · SP","Nossa fábrica",GALERIA.fabrica,nP+2);
html += pgGaleria("Fabricação própria","Equipamentos",GALERIA.equipamentos,nP+3);

html += `<div class="page contra" data-density="hard"><div class="pg">
  <h2>Vamos montar a sua planta?</h2>
  <a class="wa" id="waContra" target="_blank" rel="noopener">${WA_ICON}Falar no WhatsApp</a>
  <dl>
    <dt>Telefone</dt><dd><a href="${EMPRESA.telLink}">${EMPRESA.tel}</a></dd>
    ${EMPRESA.emails.map(e=>`<dt>${e[0]}</dt><dd><a href="mailto:${e[1]}">${e[1]}</a></dd>`).join("")}
    <dt>Endereço</dt><dd><a href="${EMPRESA.mapa}" target="_blank" rel="noopener">${EMPRESA.endereco}</a></dd>
    <dt>Instagram</dt><dd><a href="${EMPRESA.insta}" target="_blank" rel="noopener">@sl_oleos</a></dd>
  </dl>
  <img class="logo" src="${LOGO}" alt="SL Óleos">
</div></div>`;

livro.innerHTML = html;
document.getElementById("waContra").href = waLink("Olá! Vi o catálogo da SL Óleos e gostaria de falar com a equipe comercial.");
const TOTAL = livro.querySelectorAll(".page").length;

const mesa = document.querySelector(".mesa");
const pf = new St.PageFlip(livro, {
  width: 420, height: 594, size: "stretch", minWidth: 240, maxWidth: 620, minHeight: 340, maxHeight: 880,
  showCover: true, usePortrait: true, mobileScrollSupport: false, maxShadowOpacity: .45, flippingTime: 750,
  disableFlipByClick: true, clickEventForward: true
});
function ajustar(){
  const h = mesa.clientHeight - 52, w = mesa.clientWidth - 24, duas = w > 760;
  const pw = Math.min(duas ? w/2 : w, h * 420/594);
  livro.style.width = (duas ? pw*2 : pw) + "px"; livro.style.height = (pw * 594/420) + "px";
}
ajustar();
pf.loadFromHTML(livro.querySelectorAll(".page"));
addEventListener("resize", () => { ajustar(); pf.update && pf.update(); });
const pag = document.getElementById("pag");
const mostrarPag = i => pag.textContent = i === 0 ? "CAPA" : i === TOTAL-1 ? "CONTRACAPA" : `${String(i+1).padStart(2,"0")} / ${TOTAL}`;
pf.on("flip", e => { mostrarPag(e.data); dica.style.opacity = 0; });
document.getElementById("ant").onclick = () => pf.flipPrev();
document.getElementById("prox").onclick = () => pf.flipNext();
document.getElementById("irIndice").onclick = () => pf.flip(1);
livro.addEventListener("click", e => { const b = e.target.closest("[data-ir]"); if (b) pf.flip(+b.dataset.ir - 1); });
addEventListener("keydown", e => { if (e.key==="ArrowRight") pf.flipNext(); if (e.key==="ArrowLeft") pf.flipPrev(); });
const dica = document.getElementById("dica"); setTimeout(() => dica.style.opacity = 0, 2600);
montarBarraOrcamento();
</script>
</body>
</html>
